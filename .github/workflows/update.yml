name: Collect plate market briefing
on:
  schedule:
    # 07:17 Central: run both UTC offsets and gate using America/Chicago.
    - cron: '17 12,13 * * *'
  workflow_dispatch:
    inputs:
      revision_reason:
        description: 'Optional reason to append an explicit forecast revision; never replaces an old edition'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'discover_prospects.py'
      - 'qualify_prospects.py'
      - 'data/prospect-profile.json'
      - 'forecast.py'
      - 'intelligence.py'
      - 'data/market-evidence.json'
      - 'test_*.py'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.png'
      - 'data/forecast-context.json'
      - 'data/reviewed-evidence.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: plate-market-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Central-time schedule
        id: clock
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$(TZ=America/Chicago date +%H)" = "07" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Test generation safeguards
        if: steps.clock.outputs.run == 'true'
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Collect and validate report
        if: steps.clock.outputs.run == 'true'
        run: python collect.py
      - name: Discover potential plate prospects from public business listings
        if: steps.clock.outputs.run == 'true'
        run: python discover_prospects.py
      - name: Maintain monthly forecast history
        if: steps.clock.outputs.run == 'true'
        env:
          FORECAST_REVISION_REASON: ${{ inputs.revision_reason }}
        run: |
          if [ -n "$FORECAST_REVISION_REASON" ]; then
            python forecast.py --revision-reason "$FORECAST_REVISION_REASON"
          else
            python forecast.py
          fi
      - name: Update Market Pulse and preserve weekly observations
        if: steps.clock.outputs.run == 'true'
        run: python intelligence.py
      - name: Commit generated report
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/forecasts.json data/intelligence.json data/pulse-history.json data/prospects.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update plate intelligence and preserve observation history'
            git push
          fi
      # GITHUB_TOKEN commits do not trigger another Pages branch build.
      # Deploy the freshly generated root directly, excluding the legacy subfolder.
      - name: Prepare Pages artifact
        if: steps.clock.outputs.run == 'true'
        run: |
          mkdir -p _site/data
          cp index.html sw.js manifest.webmanifest icon.png _site/
          cp data/latest.json data/forecasts.json data/intelligence.json data/pulse-history.json data/prospects.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: steps.clock.outputs.run == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.clock.outputs.run == 'true'
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
